<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Atsada Sanghan</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= HEADER & NAVIGATION ================= -->
    <header class="top-header">
        <div class="header-container">
            <h1 class="logo">Atsada Sanghan</h1>
            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="other.html">เพิ่มเติม</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="main-content">

        <!-- Header Title -->
        <div class="profile-section">
            <h1 style="color: #1b365d; margin-bottom: 5px;">My Gallery & Works</h1>
            <p class="subtitle">คลังภาพ วิดีโอ และไฟล์มัลติมีเดีย</p>
        </div>

        <!-- 1. รูปภาพ (Image & Alt) -->
        <section class="card">
            <h2> My Profile Picture</h2>
            <div style="text-align: center; margin-top: 15px;">
                <img src="images/BAEF5560.JPG" alt="Atsada Sanghan Profile Picture" style="max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            </div>
        </section>

        <!-- 2. ฝังวิดีโอ YouTube (YouTube Embed) -->
        <section class="card">
            <h2> My YouTube Video</h2>
            <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; margin-top: 15px;">
                <iframe 
                    src="https://www.youtube.com/embed/hWPlXby8eug?si=oSKBTYtiwY4JrBKd" 
                    title="YouTube video player" 
                    style="position: absolute; top:0; left:0; width:100%; height:100%; border:0;" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <!-- 3. ไฟล์เสียง (Audio Player) -->
        <section class="card">
            <h2> My Sound</h2>
            <div style="margin-top: 15px; text-align: center;">
                <audio controls style="width: 100%; max-width: 500px;">
                    <source src="audio/i need more bullets.mp3" type="audio/mpeg">
                    เบราว์เซอร์ของคุณไม่รองรับการเล่นไฟล์เสียง
                </audio>
            </div>
        </section>

        <!-- 4. ไฟล์วิดีโอ (Video Player) -->
        <section class="card">
            <h2> My Video</h2>
            <div style="margin-top: 15px; text-align: center;">
                <video controls style="width: 100%; max-width: 600px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                    <source src="video/_i need more bullets! _.mp4" type="video/mp4">
                    เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
                </video>
            </div>
        </section>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="main-footer">
        <p>© 2026 Atsada Sanghan. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
